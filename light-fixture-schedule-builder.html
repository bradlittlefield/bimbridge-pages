<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Fixture Schedule Builder — BIMBridge Project Hub</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-background-primary: #ffffff; --color-background-secondary: #f5f5f3;
    --color-background-tertiary: #edede9; --color-text-primary: #1a1a18;
    --color-text-secondary: #6b6b68; --color-text-info: #185FA5;
    --color-border-primary: #c8c8c4; --color-border-secondary: #ddddd8; --color-border-tertiary: #e8e8e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-background-primary: #1e1e1c; --color-background-secondary: #2a2a27;
      --color-background-tertiary: #313130; --color-text-primary: #e8e8e4;
      --color-text-secondary: #9a9a94; --color-text-info: #7ab8f5;
      --color-border-primary: #4a4a46; --color-border-secondary: #3a3a37; --color-border-tertiary: #303030;
    }
  }
  html, body { background: var(--color-background-primary); color: var(--color-text-primary); font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }
  #root { padding: 0 24px; max-width: 900px; margin: 0 auto; }
  * { -webkit-font-smoothing: antialiased; }
  a { color: inherit; } button { font-family: inherit; } code, pre { font-family: ui-monospace, "SF Mono", monospace; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--color-border-secondary); border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const P = {
  name: "Light Fixture Schedule Builder", emoji: "💡",
  tagline: "Generate a complete lighting fixture schedule — type, family, wattage, and quantity per room — directly from the Revit model, in standard legend format.",
  status: "Spec — Not Started", statusColor: "#C97B1A",
  category: ["BIMBridge", "Revit Native", "Schedule Extraction"],
  githubUrl: "https://github.com/bradlittlefield/bimbridge/tree/main/revit/BIMBridge.extension/BIMBridge.tab/Lighting.panel/LightFixtureSchedule.pushbutton",
  githubFolder: "revit/.../Lighting.panel/LightFixtureSchedule.pushbutton",
  parentProject: "BIMBridge", parentUrl: "https://github.com/bradlittlefield/bimbridge",
  metrics: [{ label: "Effort", value: "Quick" }, { label: "Platform", value: "pyRevit" }, { label: "Output", value: "Excel" }, { label: "Phase", value: "Spec" }],
  techStack: ["IronPython / pyRevit (Python 2.7)", "Revit API (OST_LightingFixtures, OST_Rooms)", "IsPointInRoom geometry testing", "ZIP / XML injection for Excel output", "pyRevit forms (link selection + file picker)"],
  files: [
    { name: "script.py", size: "—", role: "Main pyRevit pushbutton script", lastCommit: "—", commitMsg: "not yet created" },
    { name: "LightFixtureSchedule_Template.xlsx", size: "—", role: "Excel output template with styled columns", lastCommit: "—", commitMsg: "not yet created" },
    { name: "README.md", size: "—", role: "Installation, usage, and flag reference", lastCommit: "—", commitMsg: "not yet created" },
  ],
  execSteps: [
    { n: 1, label: "Link & Room Collect", detail: "Select linked arch model (auto if only one). Collect OST_Rooms with Area > 0 from the linked document. Build room dict: {room_id: (number, name, boundary_solid)}.", color: "#185FA5", fill: "#B5D4F4" },
    { n: 2, label: "Fixture Assignment", detail: "Collect OST_LightingFixtures from host MEP model. For each fixture, transform Location.Point through the inverse link transform, test against rooms via IsPointInRoom. Group by (room_id, type_mark, family_name) and count.", color: "#533AB7", fill: "#CECBF6" },
    { n: 3, label: "Parameter Extract", detail: "For each unique (type_mark, family_name) group, read: wattage (Apparent Power / Power Factor or hardcoded Type parameter), Description, and Type Mark. Assemble rows: Type Mark | Family | Description | Wattage (W) | Qty | Room # | Room Name.", color: "#BA7517", fill: "#FAEEDA" },
    { n: 4, label: "Output", detail: "Option A: Inject rows into Excel template via ZIP/XML (same pattern as LPD Analysis). Option B: Create Revit ViewSchedule for OST_LightingFixtures with pre-configured fields and sort/group settings. Both sort by Type Mark then Room Number.", color: "#1D9E75", fill: "#9FE1CB" },
  ],
  quickStart: [
    "Fork LPD Analysis point-in-room logic into shared utility module",
    "Scaffold Light_Fixture_Schedule.pushbutton/ folder",
    "Build row assembly and Excel template injection",
    "Write README.md",
  ],
  relatedTools: [
    { name: "LPD Analysis", panel: "Lighting.panel", color: "#1D9E75", bg: "#0F3D2820" },
    { name: "Fixture Schedule with Specs", panel: "Lighting.panel", color: "#533AB7", bg: "#2A1D5E20" },
    { name: "Multi-Category Power Schedule", panel: "Power.panel", color: "#185FA5", bg: "#1F3A5220" },
    { name: "MEP Load Calc", panel: "schedules/", color: "#854F0B", bg: "#3D250920" },
  ],
  knownIssues: [
    "Families missing Apparent Power / Power Factor → blank wattage (same issue as LPD Analysis). Requires family standardization pass.",
    "Point-in-room logic not yet abstracted into a shared module — this refactor may need to precede building this tool.",
  ],
  planned: [
    { text: "Point-in-room assignment reusing LPD Analysis infrastructure", done: false },
    { text: "Wattage extraction from Apparent Power or Type parameter", done: false },
    { text: "Excel template injection via ZIP/XML", done: false },
    { text: "Native Revit ViewSchedule creation (Option B)", done: false },
    { text: "Summary tab: total fixture count and wattage by type", done: false },
    { text: "Filter: include/exclude emergency and exit fixtures", done: false },
    { text: "Export with cut sheet hyperlinks from CSV lookup", done: false },
  ],
  tasks: [
    { text: "Fork LPD Analysis point-in-room logic into shared utility module", done: false },
    { text: "Scaffold Light_Fixture_Schedule.pushbutton/ folder", done: false },
    { text: "Build row assembly and Excel template injection", done: false },
    { text: "Write README.md", done: false },
  ],
};

function useDark() {
  const [dark, setDark] = useState(() => window.matchMedia("(prefers-color-scheme: dark)").matches);
  useEffect(() => { const mq = window.matchMedia("(prefers-color-scheme: dark)"); const h = e => setDark(e.matches); mq.addEventListener("change", h); return () => mq.removeEventListener("change", h); }, []);
  return dark;
}

function Badge({ label, color, bg }) { return <span style={{ background: bg, color, fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", padding: "3px 10px", borderRadius: 20, textTransform: "uppercase", border: `1px solid ${color}44`, whiteSpace: "nowrap" }}>{label}</span>; }
function SectionLabel({ title, count }) { return <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--color-text-secondary)", paddingBottom: 10, display: "flex", alignItems: "center", gap: 8 }}>{title}{count != null && <span style={{ background: "var(--color-background-secondary)", color: "var(--color-text-secondary)", fontSize: 10, padding: "1px 7px", borderRadius: 20 }}>{count}</span>}</div>; }

function Collapse({ title, icon, badge, defaultOpen = false, children }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div style={{ border: "0.5px solid var(--color-border-tertiary)", borderRadius: 10, overflow: "hidden", marginBottom: 10 }}>
      <button onClick={() => setOpen(o => !o)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "11px 16px", background: "var(--color-background-primary)", border: "none", cursor: "pointer" }}>
        <span style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, fontWeight: 500, color: "var(--color-text-primary)" }}>{icon && <span>{icon}</span>}{title}</span>
        <span style={{ display: "flex", alignItems: "center", gap: 8 }}>{badge}<span style={{ color: "var(--color-text-secondary)", fontSize: 11, transform: open ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.18s", display: "inline-block" }}>▾</span></span>
      </button>
      {open && <div style={{ borderTop: "0.5px solid var(--color-border-tertiary)" }}>{children}</div>}
    </div>
  );
}

function PlaceholderMap({ dark }) {
  const C = {
    fill: dark ? "#3D2500" : "#FEF3E2",
    stroke: "#BA7517",
    text: dark ? "#FAC775" : "#854F0B",
    grid: dark ? "rgba(255,255,255,0.03)" : "rgba(0,0,0,0.04)",
    bg: dark ? "#1a1a18" : "#fafaf8",
    stub: dark ? "#555" : "#bbb",
    caption: dark ? "#666" : "#aaa",
  };
  const SVG_W = 820, SVG_H = 320;
  return (
    <div style={{ position: "relative", background: C.bg, borderRadius: 12 }}>
      <svg width="100%" viewBox={`0 0 ${SVG_W} ${SVG_H}`} style={{ display: "block" }}>
        {Array.from({ length: 18 }, (_, i) => <line key={`v${i}`} x1={i*48} y1={0} x2={i*48} y2={SVG_H} stroke={C.grid} strokeWidth="1" />)}
        {Array.from({ length: 7 }, (_, i) => <line key={`h${i}`} x1={0} y1={i*48} x2={SVG_W} y2={i*48} stroke={C.grid} strokeWidth="1" />)}
        <line x1={410} y1={40} x2={410} y2={96} stroke={C.stub} strokeWidth="0.75" strokeDasharray="4 3" opacity="0.35"/>
        <line x1={410} y1={200} x2={410} y2={256} stroke={C.stub} strokeWidth="0.75" strokeDasharray="4 3" opacity="0.35"/>
        <line x1={160} y1={148} x2={276} y2={148} stroke={C.stub} strokeWidth="0.75" strokeDasharray="4 3" opacity="0.35"/>
        <line x1={544} y1={148} x2={660} y2={148} stroke={C.stub} strokeWidth="0.75" strokeDasharray="4 3" opacity="0.35"/>
        <rect x={340} y={20} width={140} height={28} rx={5} fill="none" stroke={C.stub} strokeWidth="0.5" opacity="0.25"/>
        <rect x={96} y={134} width={160} height={28} rx={5} fill="none" stroke={C.stub} strokeWidth="0.5" opacity="0.25"/>
        <rect x={564} y={134} width={160} height={28} rx={5} fill="none" stroke={C.stub} strokeWidth="0.5" opacity="0.25"/>
        <rect x={340} y={258} width={140} height={28} rx={5} fill="none" stroke={C.stub} strokeWidth="0.5" opacity="0.25"/>
        <rect x={258} y={96} width={304} height={64} rx={10} fill={C.fill} stroke={C.stroke} strokeWidth="1.5" strokeDasharray="8 4"/>
        <text x={410} y={122} textAnchor="middle" dominantBaseline="central" fontSize="13" fontWeight="700" fill={C.text} fontFamily="system-ui,sans-serif">💡 Light Fixture Schedule Builder</text>
        <text x={410} y={144} textAnchor="middle" dominantBaseline="central" fontSize="10" fill={C.text} fontFamily="system-ui,sans-serif" opacity="0.75">⬡ Planned — not yet built</text>
        <text x={410} y={228} textAnchor="middle" fontSize="12" fill={C.caption} fontFamily="system-ui,sans-serif">Circuit map will be added when this tool is built.</text>
        <text x={410} y={250} textAnchor="middle" fontSize="10" fill={C.caption} fontFamily="ui-monospace,monospace" opacity="0.6">revit/.../Lighting.panel/LightFixtureSchedule.pushbutton</text>
      </svg>
    </div>
  );
}

function ExecFlow() {
  const [active, setActive] = useState(null);
  const steps = P.execSteps;
  return (
    <div>
      <div style={{ display: "flex", gap: 0, marginBottom: 14, position: "relative" }}>
        {steps.map((s, i) => (
          <div key={s.n} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", position: "relative" }}>
            {i < steps.length - 1 && <div style={{ position: "absolute", top: 15, left: "50%", width: "100%", height: 2, background: active===s.n||active===steps[i+1]?.n?s.color:"var(--color-border-tertiary)", transition: "background 0.2s", zIndex: 0 }} />}
            <button onClick={() => setActive(active===s.n?null:s.n)} style={{ width: 30, height: 30, borderRadius: "50%", background: active===s.n?s.color:s.fill, border: `2px solid ${s.color}`, cursor: "pointer", zIndex: 1, position: "relative", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, color: active===s.n?"#fff":s.color, transition: "background 0.15s, color 0.15s" }}>{s.n}</button>
            <span style={{ fontSize: 9, fontWeight: 600, color: active===s.n?s.color:"var(--color-text-secondary)", marginTop: 5, textAlign: "center", maxWidth: 76, lineHeight: 1.3 }}>{s.label}</span>
          </div>
        ))}
      </div>
      {active ? (() => { const s = steps.find(x => x.n===active); return <div style={{ background: "var(--color-background-secondary)", border: `1px solid ${s.color}44`, borderRadius: 10, padding: "12px 16px", display: "flex", gap: 12, alignItems: "flex-start" }}><div style={{ width: 26, height: 26, borderRadius: "50%", background: s.color, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, color: "#fff", flexShrink: 0 }}>{s.n}</div><div><div style={{ fontSize: 12, fontWeight: 600, color: s.color, marginBottom: 4 }}>Step {s.n} — {s.label}</div><div style={{ fontSize: 12, color: "var(--color-text-primary)", lineHeight: 1.7 }}>{s.detail}</div></div></div>; })() : <div style={{ fontSize: 11, color: "var(--color-text-secondary)", textAlign: "center", padding: "6px 0" }}>tap a step to expand</div>}
    </div>
  );
}

function FileManifest() {
  const icons = { ".py": "🐍", ".xlsx": "📊", ".md": "📝", ".bat": "⚙️" };
  const getIcon = name => { for (const [ext, icon] of Object.entries(icons)) if (name.endsWith(ext)) return icon; return "🖼️"; };
  return <div>{P.files.map((f, i) => <div key={f.name} style={{ display: "flex", alignItems: "flex-start", gap: 12, padding: "10px 0", borderBottom: i<P.files.length-1?"0.5px solid var(--color-border-tertiary)":"none" }}><span style={{ fontSize: 18, flexShrink: 0, marginTop: 1 }}>{getIcon(f.name)}</span><div style={{ flex: 1, minWidth: 0 }}><div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}><span style={{ fontSize: 12, fontWeight: 600, color: "var(--color-text-primary)", fontFamily: "monospace" }}>{f.name}</span><span style={{ fontSize: 10, color: "var(--color-text-secondary)", background: "var(--color-background-secondary)", padding: "1px 7px", borderRadius: 20 }}>{f.size}</span><span style={{ fontSize: 10, color: "#C97B1A", background: "#C97B1A15", padding: "1px 7px", borderRadius: 20 }}>not yet created</span></div><div style={{ fontSize: 12, color: "var(--color-text-secondary)", marginTop: 2, lineHeight: 1.5 }}>{f.role}</div></div></div>)}</div>;
}

function QuickStart() {
  const [done, setDone] = useState(Array(P.quickStart.length).fill(false));
  const toggle = i => setDone(prev => prev.map((v, j) => j===i?!v:v));
  const reset = () => setDone(Array(P.quickStart.length).fill(false));
  const n = done.filter(Boolean).length; const all = n===P.quickStart.length;
  const ACCENT = "#C97B1A";
  return (
    <div>
      <div style={{ background: "var(--color-background-tertiary)", borderRadius: 10, padding: "14px 16px", marginBottom: 10, border: "0.5px solid var(--color-border-tertiary)" }}>
        <div style={{ color: ACCENT, marginBottom: 8, fontSize: 10, fontFamily: "monospace", fontWeight: 700 }}>// Light Fixture Schedule Builder — build checklist</div>
        {P.quickStart.map((step, i) => <div key={i} onClick={() => toggle(i)} style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "5px 0", cursor: "pointer", borderBottom: i<P.quickStart.length-1?"0.5px solid var(--color-border-tertiary)":"none" }}><span style={{ color: done[i]?ACCENT:"var(--color-text-secondary)", flexShrink: 0, fontWeight: 700, fontSize: 12, marginTop: 1, fontFamily: "monospace" }}>{done[i]?"✓":`${i+1}.`}</span><span style={{ fontSize: 12, color: done[i]?"var(--color-text-secondary)":"var(--color-text-primary)", textDecoration: done[i]?"line-through":"none", lineHeight: 1.6 }}>{step}</span></div>)}
      </div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        {all?<span style={{ fontSize: 12, color: ACCENT, fontWeight: 600 }}>✓ All steps complete</span>:<span style={{ fontSize: 12, color: "var(--color-text-secondary)" }}>{n} / {P.quickStart.length} steps</span>}
        <button onClick={reset} style={{ fontSize: 11, color: "var(--color-text-secondary)", background: "none", border: "0.5px solid var(--color-border-tertiary)", borderRadius: 6, padding: "3px 10px", cursor: "pointer" }}>reset</button>
      </div>
    </div>
  );
}

function TaskList({ items, setItems, accent }) {
  const toggle = i => setItems(prev => prev.map((t, j) => j===i?{...t,done:!t.done}:t));
  return <div style={{ padding: "4px 16px 10px" }}>{items.map((item, i) => <div key={i} onClick={() => toggle(i)} style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "8px 0", cursor: "pointer", borderBottom: i<items.length-1?"0.5px solid var(--color-border-tertiary)":"none" }}><div style={{ width: 15, height: 15, marginTop: 2, border: `1.5px solid ${item.done?accent:"var(--color-border-secondary)"}`, borderRadius: 3, background: item.done?accent:"transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, transition: "all 0.15s" }}>{item.done&&<span style={{ color: "#fff", fontSize: 8 }}>✓</span>}</div><span style={{ fontSize: 13, color: item.done?"var(--color-text-secondary)":"var(--color-text-primary)", textDecoration: item.done?"line-through":"none", lineHeight: 1.5 }}>{item.text}</span></div>)}</div>;
}

function App() {
  const dark = useDark();
  const [tab, setTab] = useState("overview");
  const [tasks, setTasks] = useState(P.tasks);
  const [planned, setPlanned] = useState(P.planned);
  const ACCENT = "#C97B1A";
  const ACCENT_BG_DARK = "#3D2500";
  const ACCENT_BG_LIGHT = "#FEF3E2";
  const tabs = ["overview", "circuit", "tasks"];
  const pillBadge = (n, total, accent) => <span style={{ fontSize: 10, background: n===total?`${accent}20`:"var(--color-background-secondary)", color: n===total?accent:"var(--color-text-secondary)", padding: "2px 8px", borderRadius: 20, fontWeight: 600 }}>{n}/{total}</span>;

  return (
    <div style={{ fontFamily: "system-ui,-apple-system,sans-serif", maxWidth: 680, margin: "0 auto", paddingBottom: 48 }}>
      <div style={{ paddingTop: 20, paddingBottom: 16, borderBottom: "0.5px solid var(--color-border-tertiary)", marginBottom: 20 }}>
        <div style={{ display: "flex", gap: 14, alignItems: "flex-start" }}>
          <div style={{ width: 52, height: 52, borderRadius: 12, background: dark?ACCENT_BG_DARK:ACCENT_BG_LIGHT, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26, flexShrink: 0, border: `1px solid ${ACCENT}44` }}>{P.emoji}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 4 }}>
              <h1 style={{ fontSize: 22, fontWeight: 700, margin: 0, color: "var(--color-text-primary)" }}>{P.name}</h1>
              <Badge label={P.status} color={ACCENT} bg={dark?ACCENT_BG_DARK:ACCENT_BG_LIGHT} />
            </div>
            <p style={{ fontSize: 13, color: "var(--color-text-secondary)", margin: "0 0 8px", lineHeight: 1.5 }}>{P.tagline}</p>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
              {P.category.map(c => <span key={c} style={{ fontSize: 10, background: "var(--color-background-secondary)", color: "var(--color-text-secondary)", padding: "2px 8px", borderRadius: 20, border: "0.5px solid var(--color-border-tertiary)" }}>{c}</span>)}
              <span style={{ fontSize: 11, color: "var(--color-text-secondary)", marginLeft: 4, fontStyle: "italic" }}>GitHub path planned</span>
            </div>
          </div>
        </div>
        <div style={{ marginTop: 10, fontSize: 11, color: "var(--color-text-secondary)", display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
          <span>Part of</span>
          <a href={P.parentUrl} target="_blank" style={{ color: "var(--color-text-info)", textDecoration: "none", fontWeight: 600 }}>{P.parentProject} ↗</a>
          <span style={{ opacity: 0.3 }}>·</span>
          <code style={{ fontSize: 10, background: "var(--color-background-secondary)", padding: "1px 6px", borderRadius: 4 }}>{P.githubFolder}</code>
        </div>
      </div>

      <div style={{ display: "flex", borderBottom: "0.5px solid var(--color-border-tertiary)", marginBottom: 22 }}>
        {tabs.map(t => <button key={t} onClick={() => setTab(t)} style={{ background: "none", border: "none", cursor: "pointer", padding: "8px 16px", fontSize: 13, fontWeight: tab===t?600:400, color: tab===t?ACCENT:"var(--color-text-secondary)", borderBottom: `2px solid ${tab===t?ACCENT:"transparent"}`, transition: "all 0.15s" }}>{t==="circuit"?"Circuit Map":t.charAt(0).toUpperCase()+t.slice(1)}</button>)}
      </div>

      {tab === "overview" && (
        <div>
          <SectionLabel title="At a glance" />
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginBottom: 22 }}>
            {P.metrics.map(m => <div key={m.label} style={{ background: "var(--color-background-secondary)", borderRadius: 10, padding: "12px 14px" }}><div style={{ fontSize: 10, color: "var(--color-text-secondary)", textTransform: "uppercase", letterSpacing: "0.07em", fontWeight: 600, marginBottom: 4 }}>{m.label}</div><div style={{ fontSize: 22, fontWeight: 700, color: "var(--color-text-primary)", lineHeight: 1 }}>{m.value}</div></div>)}
          </div>
          <SectionLabel title="Tech stack" />
          <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 22 }}>
            {P.techStack.map(t => <span key={t} style={{ fontSize: 12, padding: "5px 12px", borderRadius: 20, background: "var(--color-background-secondary)", border: "0.5px solid var(--color-border-secondary)", color: "var(--color-text-primary)", fontWeight: 500 }}>{t}</span>)}
          </div>
          <SectionLabel title="Planned execution flow — click any step" />
          <div style={{ marginBottom: 22 }}><ExecFlow /></div>
          <SectionLabel title="Build checklist" />
          <div style={{ marginBottom: 22 }}><QuickStart /></div>
          <SectionLabel title="Planned files" count={P.files.length} />
          <div style={{ border: "0.5px solid var(--color-border-tertiary)", borderRadius: 10, padding: "0 16px", marginBottom: 22 }}><FileManifest /></div>
          <SectionLabel title="Related tools in BIMBridge" />
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 8, marginBottom: 22 }}>
            {P.relatedTools.map(tool => <div key={tool.name} style={{ background: tool.bg, border: `0.5px solid ${tool.color}44`, borderRadius: 10, padding: "10px 14px", display: "flex", alignItems: "center", gap: 10 }}><span style={{ fontSize: 18 }}>🔧</span><div><div style={{ fontSize: 12, fontWeight: 600, color: tool.color }}>{tool.name}</div><div style={{ fontSize: 10, color: tool.color, opacity: 0.7, marginTop: 1 }}>{tool.panel}</div></div></div>)}
          </div>
          <Collapse title="Known issues / blockers" icon="⚠️" badge={<span style={{ fontSize: 10, background: dark?"#501313":"#FCEBEB", color: "#E24B4A", padding: "2px 7px", borderRadius: 20, fontWeight: 600 }}>{P.knownIssues.length}</span>}>
            <div style={{ padding: "12px 16px" }}>
              {P.knownIssues.map((issue, i) => <div key={i} style={{ display: "flex", gap: 10, alignItems: "flex-start", padding: "7px 10px", marginBottom: 6, background: dark?"#50131320":"#FCEBEB", borderRadius: 8, border: "0.5px solid #E24B4A33" }}><span style={{ color: "#E24B4A", flexShrink: 0 }}>⚠</span><span style={{ fontSize: 12, color: dark?"#F09595":"#A32D2D", lineHeight: 1.6 }}>{issue}</span></div>)}
            </div>
          </Collapse>
        </div>
      )}

      {tab === "circuit" && (
        <div>
          <p style={{ fontSize: 12, color: "var(--color-text-secondary)", marginBottom: 12, lineHeight: 1.7 }}>Planned location in the BIMBridge repo. Circuit map will be updated when this tool is built and paths are confirmed.</p>
          <PlaceholderMap dark={dark} />
          <div style={{ marginTop: 10, fontSize: 11, color: "var(--color-text-secondary)" }}>Planned path: <code style={{ fontSize: 10, background: "var(--color-background-secondary)", padding: "1px 6px", borderRadius: 4 }}>{P.githubFolder}</code></div>
        </div>
      )}

      {tab === "tasks" && (
        <div>
          <p style={{ fontSize: 12, color: "var(--color-text-secondary)", marginBottom: 16, lineHeight: 1.7 }}>Session-only — state resets on reload. Use the Notion page for persistence.</p>
          <Collapse title="Build tasks" icon="⚡" defaultOpen={true} badge={pillBadge(tasks.filter(t=>t.done).length, tasks.length, ACCENT)}><TaskList items={tasks} setItems={setTasks} accent={ACCENT} /></Collapse>
          <Collapse title="Planned features" icon="🔮" badge={pillBadge(planned.filter(t=>t.done).length, planned.length, "#185FA5")}><TaskList items={planned} setItems={setPlanned} accent="#185FA5" /></Collapse>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
